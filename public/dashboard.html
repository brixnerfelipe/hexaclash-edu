<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaClash Edu - Dashboard do Professor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #c19a6b;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: transparent;
        }
        .header img {
            width: 180px;
        }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #000;
            margin: 0;
            text-transform: uppercase;
        }
        .dashboard-layout {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0; /* allows children to scroll */
        }
        
        /* LEFT PANEL */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 350px;
        }
        
        .panel-box {
            background-color: #f4eadc;
            border: 4px solid #4a3424;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        
        .panel-box h3 {
            margin-top: 0;
            color: #4a3424;
            font-weight: 800;
            font-size: 22px;
        }
        
        #room-tabs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .room-tab {
            background-color: #c19a6b;
            border: 3px solid #4a3424;
            border-radius: 25px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 32px;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            color: #a72e25;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-tab:hover {
            transform: scale(1.02);
        }
        .room-tab.active {
            border-color: #f4eadc;
            box-shadow: 0 0 0 3px #a72e25;
        }
        .room-tab i {
            color: white;
            font-size: 24px;
        }
        
        .csv-upload-btn {
            background-color: #c19a6b;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .csv-desc {
            font-size: 12px;
            color: #4a3424;
            margin: 0;
            line-height: 1.2;
        }
        
        /* RIGHT PANEL */
        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            background-color: #f4eadc;
            border: 4px solid #4a3424;
            border-radius: 20px;
            padding: 20px;
            position: relative;
        }
        
        .create-room-wrapper {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
        }
        
        #create-room-btn {
            background-color: #a72e25;
            color: white;
            border: 4px solid #694931;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        #create-room-btn:hover {
            transform: scale(1.05);
        }
        
        /* ROOM CARD (Right Panel Content) */
        #rooms-container {
            flex: 1;
        }
        
        .room-card {
            display: none; /* hidden by default, shown when active */
            height: 100%;
            flex-direction: column;
        }
        .room-card.active {
            display: flex;
        }
        
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .room-pin-display {
            font-family: 'Outfit', sans-serif;
            font-size: 60px;
            font-weight: 900;
            color: #a72e25;
            margin: 0;
            display: flex;
            align-items: center;
        }
        .room-pin-display span {
            font-size: 30px;
            color: #694931;
            margin-right: 10px;
        }
        
        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn-start-game, .btn-projector {
            background-color: #694931;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 30px;
            font-size: 20px;
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .btn-start-game:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .players-section h3 {
            color: #694931;
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        
        .players-list {
            list-style: none;
            padding: 10px;
            margin: 0;
            background: white;
            border: 3px solid #8a6d54;
            border-radius: 15px;
            flex: 1;
            overflow-y: auto;
            min-height: 150px;
        }
        
        .players-list li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #4a3424;
        }
        .players-list li:last-child {
            border-bottom: none;
        }
        .player-status {
            color: #888;
            font-weight: normal;
        }
        
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="img/logo.png" alt="WAR edu logo" onerror="this.src=''; this.alt='WAR edu';">
        </div>
        <h1>Central de Comando</h1>
    </div>

    <div class="dashboard-layout">
        <!-- PAINEL ESQUERDO -->
        <div class="left-panel">
            <div class="panel-box">
                <h3>MINHAS SALAS</h3>
                <div id="room-tabs-container">
                    <!-- Tabs inseridas via JS -->
                </div>
            </div>
            
            <div class="panel-box">
                <h3 id="csv-count">0 PERGUNTAS VÁLIDAS</h3>
                <label for="csv-upload" class="csv-upload-btn">Carregar novo .csv</label>
                <input type="file" id="csv-upload" accept=".csv" style="display: none;">
                <p class="csv-desc">Col.1: Pergunta; Col.2: alternativa correta;<br>Col. 3,4 e 5: alternativas erradas</p>
            </div>
        </div>

        <!-- PAINEL DIREITO -->
        <div class="right-panel">
            <div id="rooms-container">
                <!-- Cards das salas (detalhes) renderizados aqui -->
            </div>
            
            <div class="create-room-wrapper">
                <button id="create-room-btn">Criar nova sala</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mapData.js?v=2"></script>
    <script src="js/logic.js?v=2"></script>
    <script>
        const socket = io();
        const createRoomBtn = document.getElementById('create-room-btn');
        const roomsContainer = document.getElementById('rooms-container');
        const csvUpload = document.getElementById('csv-upload');
        const csvCount = document.getElementById('csv-count');
        
        let activeRooms = [];
        let parsedQuestions = [];
        let roomPlayers = {};

        // UI Criar Sala
        createRoomBtn.addEventListener('click', () => {
            socket.emit('create_room');
        });

        // Escuta retorno do server
        socket.on('room_created', (pin) => {
            activeRooms.push(pin);
            roomPlayers[pin] = [];
            renderRoomCard(pin);
            // Injeta questoes se já tiver lido o csv
            if (parsedQuestions.length > 0) {
                socket.emit('upload_csv', { pin: pin, bank: parsedQuestions });
            }
        });

        socket.on('update_players', (data) => {
            roomPlayers[data.pin] = data.players;
            const list = document.getElementById(`players-${data.pin}`);
            const isStarted = document.getElementById(`start-btn-${data.pin}`) && document.getElementById(`start-btn-${data.pin}`).disabled;
            
            if (list) {
                if (data.players.length === 0) {
                    list.innerHTML = `<li>Aguardando alunos... <span class="player-status">--</span></li>`;
                } else {
                    list.innerHTML = '';
                    data.players.forEach(p => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${p.name.toUpperCase()}</span> <span class="player-status">${isStarted ? 'JOGANDO' : 'ESPERANDO INÍCIO'}</span>`;
                        list.appendChild(li);
                    });
                }
            }
        });

        socket.on('room_closed', (msg) => {
            alert(msg);
            location.reload();
        });

        function selectRoom(pin) {
            // Remove active de todas as abas e cards
            document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.room-card').forEach(c => c.classList.remove('active'));
            
            // Adiciona active no clicado
            const tab = document.getElementById(`tab-${pin}`);
            const card = document.getElementById(`room-${pin}`);
            
            if (tab) tab.classList.add('active');
            if (card) card.classList.add('active');
        }

        function renderRoomCard(pin) {
            // 1. Cria a aba na lista da esquerda
            const tabContainer = document.getElementById('room-tabs-container');
            const tab = document.createElement('div');
            tab.className = 'room-tab';
            tab.id = `tab-${pin}`;
            tab.innerHTML = `
                <span>${pin}</span>
                <i class="fa-regular fa-clock" id="icon-${pin}"></i>
            `;
            tab.addEventListener('click', () => selectRoom(pin));
            tabContainer.prepend(tab);

            // 2. Cria o card de detalhes na direita
            const card = document.createElement('div');
            card.className = 'room-card';
            card.id = `room-${pin}`;
            card.innerHTML = `
                <div class="room-header">
                    <p class="room-pin-display"><span>PIN:</span> ${pin}</p>
                    <div class="room-actions">
                        <button class="btn-start-game" id="start-btn-${pin}">Iniciar</button>
                        <a href="host.html?pin=${pin}" target="_blank" class="btn-projector">Projetar</a>
                    </div>
                </div>
                
                <div class="players-section">
                    <h3>JOGADORES (6 MÁX):</h3>
                    <ul class="players-list" id="players-${pin}">
                        <li>Aguardando alunos... <span class="player-status">--</span></li>
                    </ul>
                </div>
            `;
            roomsContainer.appendChild(card);
            
            // Auto-seleciona a sala recém criada
            selectRoom(pin);
            
            const startBtn = document.getElementById(`start-btn-${pin}`);
            const icon = document.getElementById(`icon-${pin}`);
            
            startBtn.addEventListener('click', () => {
                const players = roomPlayers[pin];
                if (!players || players.length < 2) {
                    alert("Precisa de pelo menos 2 alunos!");
                    return;
                }
                
                startBtn.disabled = true;
                startBtn.textContent = 'Partida Iniciada!';
                startBtn.style.backgroundColor = '#95a5a6';
                
                // Muda ícone da aba
                if(icon) {
                    icon.className = 'fa-solid fa-play';
                }
                
                // Atualiza status dos alunos na lista
                const list = document.getElementById(`players-${pin}`);
                if (list) {
                    const statusSpans = list.querySelectorAll('.player-status');
                    statusSpans.forEach(span => span.textContent = 'JOGANDO');
                }
                
                // Inicializa a engine e o map localmente
                window.initGame(); // zera gameState local
                
                // Cadastra os players no motor
                players.forEach((p, index) => {
                    const color = PLAYER_COLORS[index % PLAYER_COLORS.length];
                    gameState.players[index + 1] = {
                        id: p.id, // O ID agora é o socket.id
                        name: p.name,
                        color: color,
                        objective: null,
                        territoriesCount: 0,
                        totalArmies: 0,
                        armiesNextTurn: 0,
                        resolvedQuestions: []
                    };
                });
                
                // Sorteia tudo
                window.startGame();
                
                // Emite o estado inicial pro servidor distribuir
                socket.emit('sync_state', { pin: pin, state: window.gameState });
                // Emite o start (para o aluno trocar de tela)
                socket.emit('start_game', pin);
            });
        }

        // Leitor simples de CSV
        csvUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                parsedQuestions = [];
                
                lines.forEach((line, index) => {
                    const result = [];
                    let startValueBnd = 0;
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const c = line[i];
                        if (c === '"') {
                            inQuotes = !inQuotes;
                        } else if (c === ',' && !inQuotes) {
                            result.push(line.substring(startValueBnd, i));
                            startValueBnd = i + 1;
                        }
                    }
                    result.push(line.substring(startValueBnd));
                    const cols = result.map(v => v.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
                    
                    if(cols.length >= 5 && cols[0] && cols[1] && cols[2] && cols[3] && cols[4]) {
                        parsedQuestions.push({
                            id: 'q_' + index,
                            question: cols[0],
                            correctAnswer: cols[1],
                            wrongAnswers: [cols[2], cols[3], cols[4]]
                        });
                    }
                });
                
                csvCount.textContent = `${parsedQuestions.length} questões lidas.`;
                window.gameState.questionBank = parsedQuestions;
                
                // Injeta em todas as salas já abertas
                activeRooms.forEach(pin => {
                    socket.emit('upload_csv', { pin: pin, bank: parsedQuestions });
                });
            };
            reader.readAsText(file);
        });

        // HACK: Substituir o ouvinte genérico para receber jogadores da sala certa
        // Como o server emite update_players sem o PIN, eu modifiquei lá? Não, eu emiti:
        // io.to(pin).emit('update_players', gameRooms[pin].players);
        // Entao só recebo array de players. Se eu estiver ouvindo aqui, eu não sei o PIN.
        // Vou interceptar isso injetando o PIN no update_players lá no server em breve se necessário.
    </script>
</body>
</html>
