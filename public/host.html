<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaClash Edu - Modo Projetor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        /* Área do Mapa (Esquerda) */
        .map-area {
            flex: 3;
            background-color: #a2d5f2;
            position: relative;
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
        }

        #game-map {
            width: 100%;
            height: 100%;
            /* Desativa qualquer interação do mouse no mapa */
            pointer-events: none;
        }

        /* Painel Lateral (Direita) */
        .sidebar {
            flex: 1;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            border-left: 6px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            background-color: var(--panel-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--border-color);
        }

        .sidebar-header h1 {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: #333;
            font-size: 28px;
        }

        .sidebar-header h2 {
            margin: 5px 0 0;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }

        /* Placar */
        .leaderboard {
            padding: 15px;
            border-bottom: 4px solid var(--border-color);
            background-color: #fff;
            max-height: 40%;
            overflow-y: auto;
        }

        .leaderboard h3 {
            margin: 0 0 10px;
            font-family: 'Outfit', sans-serif;
            color: #333;
            text-align: center;
        }

        .player-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .player-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            margin-right: 10px;
        }

        .player-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 14px;
        }

        /* Action Log */
        .action-log-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            background-color: #ecf0f1;
            overflow: hidden;
        }

        .action-log-container h3 {
            margin: 0 0 10px;
            font-family: 'Poppins', sans-serif;
            color: #333;
            text-align: center;
        }

        .action-log {
            flex: 1;
            overflow-y: auto;
            background-color: #fff;
            border: 3px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry {
            font-size: 13px;
            padding: 8px;
            background-color: #fdfdfd;
            border-left: 4px solid var(--border-color);
            border-radius: 4px;
            animation: fadeIn 0.3s ease-out;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
        }

        .log-time {
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .waiting-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 20px 40px;
            border-radius: 20px;
            border: 4px solid var(--border-color);
        }
        @keyframes laserShoot {
            0% { stroke-dashoffset: 100; stroke-opacity: 1; stroke-width: 4; }
            50% { stroke-width: 8; stroke-opacity: 1; }
            100% { stroke-dashoffset: 0; stroke-opacity: 0; stroke-width: 2; }
        }
        .fx-laser {
            stroke: #e74c3c;
            stroke-dasharray: 30 15;
            animation: laserShoot 0.4s linear infinite;
        }
        @keyframes fxPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #e74c3c); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px #e74c3c); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #e74c3c); }
        }
        .fx-target {
            transform-origin: center;
            animation: fxPulse 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="map-area">
        <div id="waiting-msg" class="waiting-msg">Aguardando início da partida...</div>
        <svg id="game-map" viewBox="95 30 755 675" preserveAspectRatio="xMidYMid meet" style="display: none;"></svg>
        <svg id="fx-layer" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;"></svg>
        <div id="global-timer" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e74c3c; color: white; padding: 15px 30px; font-size: 32px; font-weight: bold; border-radius: 12px; border: 4px solid #c0392b; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.4);">
            ⏳ 60s
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="WAR edu" style="width: 180px;">
            <h2 id="room-pin-display">SALA: ----</h2>
        </div>
        
        <div class="leaderboard">
            <h3>Placar</h3>
            <div id="leaderboard-content">
                <!-- Linhas dos jogadores inseridas via JS -->
            </div>
        </div>

        <div class="action-log-container">
            <h3>Eventos da Partida</h3>
            <div class="action-log" id="action-log">
                <!-- Logs inseridos via JS -->
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; flex-direction: column;">
        <h1 style="color: #f1c40f; font-size: 80px; text-shadow: 0 0 20px #f1c40f; margin-bottom: 10px; font-family: 'Poppins', sans-serif;">🏆 O SUPREMO 🏆</h1>
        <div id="podium-container" style="background: var(--panel-bg); border: 8px solid var(--border-color); border-radius: 20px; padding: 40px; text-align: center; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div id="winner-color-badge" style="width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--border-color); margin: 0 auto 20px;"></div>
            <h2 id="winner-name" style="font-size: 50px; color: #333; margin: 0;">Nome</h2>
            <p style="font-size: 20px; color: #666; margin-top: 15px; font-weight: bold;">Dominou o campo de batalha e se tornou o grande estrategista da turma!</p>
        </div>
    </div>

    <!-- Scripts do Jogo (Passivo) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mapData.js"></script>
    <!-- Para o Host, precisamos de uma versão mockada do logic.js ou apenas do objeto gameState e as funções de renderização -->
    <script>
        // Inicializa o state global necessário pro ui.js funcionar passivamente
        var gameState = {
            status: 'lobby',
            players: {},
            territories: [],
            turn: 1,
            currentPlayerIndex: 0,
            draftArmies: 0,
            questionBank: [],
            actionLogs: []
        };
    </script>
    <!-- ui.js usa getCurrentPlayerId() e outras funções do logic, então é melhor importarmos o logic inteiro para evitar erros de undefined -->
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>

    <!-- Script Principal do Projetor -->
    <script>
        const socket = io();
        
        // Extrai o PIN da URL
        const urlParams = new URLSearchParams(window.location.search);
        const pin = urlParams.get('pin');
        
        const waitingMsg = document.getElementById('waiting-msg');
        const gameMap = document.getElementById('game-map');
        const pinDisplay = document.getElementById('room-pin-display');
        const leaderboardContent = document.getElementById('leaderboard-content');
        const actionLog = document.getElementById('action-log');
        
        if (pin) {
            pinDisplay.textContent = `SALA: ${pin}`;
            socket.emit('host_join', pin);
        } else {
            pinDisplay.textContent = `ERRO: PIN INVÁLIDO`;
            waitingMsg.textContent = "URL Inválida. Faltou o ?pin=";
        }

        socket.on('room_error', (msg) => {
            waitingMsg.textContent = msg;
        });

        socket.on('room_closed', (msg) => {
            waitingMsg.textContent = msg;
            gameMap.style.display = 'none';
            waitingMsg.style.display = 'block';
        });

        // O Motor Passivo: Ouve o estado e desenha
        socket.on('sync_state', (state) => {
            if (!state || !state.territories) return;
            
            // Oculta a mensagem de espera se o jogo começou
            if (state.status !== 'lobby') {
                waitingMsg.style.display = 'none';
                gameMap.style.display = 'block';
            }

            // Atualiza o state local
            gameState = state;

            // Checa se o jogo acabou
            if (gameState.status === 'GAMEOVER' && gameState.winnerId) {
                const winner = gameState.players[gameState.winnerId];
                if (winner) {
                    document.getElementById('gameover-modal').style.display = 'flex';
                    document.getElementById('winner-name').textContent = winner.name;
                    document.getElementById('winner-color-badge').style.backgroundColor = winner.color;
                }
            } else {
                document.getElementById('gameover-modal').style.display = 'none';
            }

            // Renderiza o SVG passivamente
            renderMap();

            // Atualiza o Placar
            updateLeaderboard();

            // Atualiza os Logs
            updateActionLog();
        });

        socket.on('show_combat_visual', (data) => {
            const { originId, targetId } = data;
            const origin = gameState.territories.find(t => t.id === originId);
            const target = gameState.territories.find(t => t.id === targetId);
            if (!origin || !target) return;

            const offsetX = 180;
            const offsetY = 100;
            const HEX_WIDTH = Math.sqrt(3) * 45;
            const HEX_HEIGHT = 2 * 45;

            const ox = origin.col * HEX_WIDTH + (origin.row % 2) * (HEX_WIDTH / 2) + offsetX;
            const oy = origin.row * HEX_HEIGHT * 0.75 + offsetY;
            
            const tx = target.col * HEX_WIDTH + (target.row % 2) * (HEX_WIDTH / 2) + offsetX;
            const ty = target.row * HEX_HEIGHT * 0.75 + offsetY;

            const fxLayer = document.getElementById('fx-layer');
            if (!fxLayer) return;
            fxLayer.innerHTML = '';
            
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", ox);
            line.setAttribute("y1", oy);
            line.setAttribute("x2", tx);
            line.setAttribute("y2", ty);
            line.setAttribute("class", "fx-laser");
            fxLayer.appendChild(line);

            const explosion = document.createElementNS("http://www.w3.org/2000/svg", "text");
            explosion.setAttribute("x", tx);
            explosion.setAttribute("y", ty);
            explosion.setAttribute("class", "fx-target");
            explosion.setAttribute("style", "font-size: 40px; text-anchor: middle; dominant-baseline: central;");
            explosion.textContent = "💥";
            fxLayer.appendChild(explosion);
        });

        socket.on('hide_combat_visual', () => {
            const fxLayer = document.getElementById('fx-layer');
            if (fxLayer) fxLayer.innerHTML = '';
        });

        function updateLeaderboard() {
            leaderboardContent.innerHTML = '';
            
            const pIds = Object.keys(gameState.players);
            if (pIds.length === 0) {
                leaderboardContent.innerHTML = '<div style="text-align: center; color: #777;">Nenhum jogador</div>';
                return;
            }

            // Ordena os jogadores por total de territórios (decrescente)
            pIds.sort((a, b) => gameState.players[b].territoriesCount - gameState.players[a].territoriesCount);

            pIds.forEach(pId => {
                const p = gameState.players[pId];
                const row = document.createElement('div');
                row.className = 'player-row';
                
                // Destaque se for o turno dele
                const currentPlayerId = Object.keys(gameState.players).map(Number)[gameState.currentPlayerIndex];
                if (p.id === currentPlayerId && gameState.status !== 'GAMEOVER') {
                    row.style.borderColor = p.color;
                    row.style.boxShadow = `0 0 5px ${p.color}`;
                }

                const offlineOpacity = p.isOffline ? 'opacity: 0.5;' : '';
                const offlineBadge = p.isOffline ? ' ⚠️' : '';

                row.innerHTML = `
                    <div class="player-color" style="background-color: ${p.color}; ${offlineOpacity}"></div>
                    <div class="player-info" style="${offlineOpacity}">
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.name}${offlineBadge}</span>
                        <span style="margin-left: 10px;" title="Territórios">🏰 ${p.territoriesCount}</span>
                        <span style="margin-left: 10px;" title="Exércitos">🗡️ ${p.totalArmies}</span>
                    </div>
                `;
                leaderboardContent.appendChild(row);
            });
        }

        let lastLogCount = 0;
        function updateActionLog() {
            if (!gameState.actionLogs) return;
            
            // Renderiza apenas se houver novos logs (ou se recomeçar)
            if (gameState.actionLogs.length !== lastLogCount) {
                actionLog.innerHTML = '';
                
                gameState.actionLogs.forEach(log => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    
                    // Identifica o tipo de ação pela mensagem para pintar a borda
                    if (log.message.includes('atacou')) entry.style.borderLeftColor = '#e74c3c';
                    else if (log.message.includes('recebeu')) entry.style.borderLeftColor = '#3498db';
                    else if (log.message.includes('VITÓRIA')) entry.style.borderLeftColor = '#f1c40f';
                    else if (log.message.includes('falhou')) entry.style.borderLeftColor = '#95a5a6';

                    entry.innerHTML = `<span class="log-time">${log.time}</span>${log.message}`;
                    actionLog.appendChild(entry);
                });

                // Auto-scroll para o final
                actionLog.scrollTop = actionLog.scrollHeight;
                lastLogCount = gameState.actionLogs.length;
            }
        }
    </script>
</body>
</html>
